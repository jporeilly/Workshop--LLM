# Docker Compose configuration for an AI development stack
# This setup includes n8n (workflow automation), Postgres, 
# Qdrant (vector database), Open-WebUI, and Flowise
# Ollama will run on the host machine instead of in a container
# ALL CONTAINERS USE HOST NETWORK FOR SIMPLIFIED ACCESS

# Define volumes for persistent storage
volumes:
  # Storage for n8n data (workflows, executions, etc.)
  n8n_storage:
  # Storage for PostgreSQL database files
  postgres_storage:
  # Storage for Qdrant vector database
  qdrant_storage:
  # Storage for Open-WebUI configuration and data
  open-webui:
  # Storage for Flowise configuration and data
  flowise:
  # Your external volume
  genai_flowise:
    external: true

# Common service configuration for n8n containers (using YAML anchor)
x-n8n: &service-n8n
  image: n8nio/n8n:latest
  network_mode: "host"  # Use host networking
  environment:
    # Database configuration for n8n
    - DB_TYPE=postgresdb
    - DB_POSTGRESDB_HOST=localhost  # Using localhost instead of service name
    - DB_POSTGRESDB_USER=${POSTGRES_USER}  # Uses environment variable
    - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}  # Uses environment variable
    # n8n specific configuration
    - N8N_RUNNERS_ENABLED=true  # Enable workflow runners for performance
    - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true  # Security measure for settings file
    - N8N_DIAGNOSTICS_ENABLED=false  # Disable sending diagnostics data
    - N8N_PERSONALIZATION_ENABLED=false  # Disable personalization features
    # Security keys (must be provided in environment or .env file)
    - N8N_ENCRYPTION_KEY
    - N8N_USER_MANAGEMENT_JWT_SECRET
    - NVIDIA_VISIBLE_DEVICES=all
    - NVIDIA_DRIVER_CAPABILITIES=compute,utility
  # No need for links or extra_hosts with host networking

# Define all services
services:
  # Flowise - a low-code AI automation platform
  flowise:
    image: flowiseai/flowise
    network_mode: "host"  # Use host networking
    restart: unless-stopped
    container_name: flowise
    environment:
      - PORT=3001
      # Using internal SQLite database in the default location
      - DATABASE_TYPE=sqlite
      - DATABASE_PATH=/root/.flowise/database.sqlite
      # Increase memory limit if needed
      - NODE_OPTIONS=--max-old-space-size=4096
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    # No need for ports with host networking
    volumes:
      - genai_flowise:/root/.flowise  # Named volume for Flowise data
      - ./flowise-uploads:/root/uploads  # Mount point for document uploads in GenAI folder
    entrypoint: /bin/sh -c "mkdir -p /root/uploads && chmod 777 /root/uploads && sleep 3; flowise start"  # Create uploads directory and ensure proper permissions
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Open-WebUI - a web interface for Ollama models
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    network_mode: "host"  # Already using host networking
    restart: unless-stopped
    container_name: open-webui
    environment:
      - OLLAMA_API_BASE_URL=http://localhost:11434/api
      - PORT=8090  # Changed port to 8090 to avoid conflicts
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - open-webui:/app/backend/data  # Persist Open-WebUI data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # PostgreSQL database - used by n8n for workflow storage
  postgres:
    image: postgres:16-alpine
    network_mode: "host"  # Use host networking
    restart: unless-stopped
    # No need for ports with host networking, but adding environment variable to avoid port conflicts
    environment:
      - POSTGRES_USER  # Username from environment variable
      - POSTGRES_PASSWORD  # Password from environment variable
      - POSTGRES_DB  # Database name from environment variable
      - PGPORT=5432  # Explicitly set PostgreSQL port
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - postgres_storage:/var/lib/postgresql/data  # Persist database files
    healthcheck:
      # Check if PostgreSQL is ready to accept connections
      test: ['CMD-SHELL', 'pg_isready -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  # n8n - workflow automation platform
  n8n:
    <<: *service-n8n  # Inherit configuration from service-n8n anchor
    container_name: n8n
    restart: unless-stopped
    # No need for ports with host networking
    volumes:
      - n8n_storage:/home/node/.n8n  # Persist n8n data
      - ./n8n-uploads:/home/node/uploads  # Mount point for document uploads in GenAI folder
    depends_on:
      postgres:
        condition: service_healthy  # Wait until PostgreSQL is healthy

  # Qdrant - vector database for similarity search
  qdrant:
    image: qdrant/qdrant
    container_name: qdrant
    network_mode: "host"  # Use host networking
    restart: unless-stopped
    # No need for ports with host networking
    volumes:
      - qdrant_storage:/qdrant/storage  # Persist vector database files
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

# You will need to manually run these commands on your host:
# - ollama pull llama3.1
# - ollama pull nomic-embed-text