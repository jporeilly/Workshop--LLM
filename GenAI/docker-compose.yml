# Define volumes for persistent data storage
volumes:
  n8n_storage:           # Stores n8n workflow data
  postgres_storage:      # Stores PostgreSQL database files
  ollama_storage:        # Stores Ollama models and configurations
  qdrant_storage:        # Stores Qdrant vector database files
  openwebui_storage:     # Stores OpenWebUI data (chat history, settings, etc.)

# Define networks for container communication
networks:
  demo:                  # All services will connect to this network

# Reusable service definitions using YAML anchors
# These are templates used by multiple services with the same base configuration

# Base configuration for n8n services
x-n8n: &service-n8n
  image: n8nio/n8n:latest
  networks: ['demo']
  environment:
    - DB_TYPE=postgresdb                              # Use PostgreSQL as database
    - DB_POSTGRESDB_HOST=postgres                     # PostgreSQL hostname
    - DB_POSTGRESDB_USER=${POSTGRES_USER}             # Database username from env
    - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}     # Database password from env
    - N8N_DIAGNOSTICS_ENABLED=false                   # Disable telemetry
    - N8N_PERSONALIZATION_ENABLED=false               # Disable personalization
    - N8N_ENCRYPTION_KEY                              # Encryption key from env
    - N8N_USER_MANAGEMENT_JWT_SECRET                  # JWT secret from env
    - OLLAMA_HOST=ollama:11434                        # Ollama host for n8n integration

# Base configuration for Ollama service
x-ollama: &service-ollama
  image: ollama/ollama:latest
  container_name: ollama                              # Fixed container name
  networks: ['demo']
  restart: unless-stopped
  ports:
    - 11434:11434                                     # Expose Ollama API port
  volumes:
    - ollama_storage:/root/.ollama                    # Persist model data

# Base configuration for initializing Ollama with models
x-init-ollama: &init-ollama
  image: ollama/ollama:latest
  networks: ['demo']
  container_name: ollama-pull-llama
  volumes:
    - ollama_storage:/root/.ollama                    # Share volume with main Ollama service
  entrypoint: /bin/sh
  environment:
    - OLLAMA_HOST=ollama:11434                        # Connect to main Ollama service
  command:
    - "-c"
    - "sleep 3; ollama pull llama3.2"                 # Pull llama3.2 model on startup

# Define all services
services:
  # PostgreSQL database used by n8n
  postgres:
    image: postgres:16-alpine
    hostname: postgres
    networks: ['demo']
    restart: unless-stopped
    environment:
      - POSTGRES_USER                                 # Username from env
      - POSTGRES_PASSWORD                             # Password from env
      - POSTGRES_DB                                   # Database name from env
    volumes:
      - postgres_storage:/var/lib/postgresql/data     # Persist database files
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  # n8n import service - imports predefined workflows on first run
  n8n-import:
    <<: *service-n8n                                  # Use n8n base configuration
    hostname: n8n-import
    container_name: n8n-import
    entrypoint: /bin/sh
    command:
      - "-c"
      - "n8n import:credentials --separate --input=/backup/credentials && n8n import:workflow --separate --input=/backup/workflows"
    volumes:
      - ./n8n/backup:/backup                          # Mount backup directory
    depends_on:
      postgres:
        condition: service_healthy                    # Wait for PostgreSQL to be ready

  # Main n8n service - workflow automation platform
  n8n:
    <<: *service-n8n                                  # Use n8n base configuration
    hostname: n8n
    container_name: n8n
    restart: unless-stopped
    ports:
      - 5678:5678                                     # Expose n8n web interface
    volumes:
      - n8n_storage:/home/node/.n8n                   # Persist n8n data
      - ./n8n/backup:/backup                          # Mount backup directory
      - ./shared:/data/shared                         # Shared data directory
    depends_on:
      postgres:
        condition: service_healthy                    # Wait for PostgreSQL to be ready
      n8n-import:
        condition: service_completed_successfully     # Wait for import to complete

  # Qdrant vector database
  qdrant:
    image: qdrant/qdrant
    hostname: qdrant
    container_name: qdrant
    networks: ['demo']
    restart: unless-stopped
    ports:
      - 6333:6333                                     # Expose Qdrant API port
    volumes:
      - qdrant_storage:/qdrant/storage                # Persist vector data

  # Base configuration for OpenWebUI - NOT DIRECTLY STARTED
  # This is only a template that's used by the profile-specific services
  openwebui-base: &openwebui-base
    image: ghcr.io/open-webui/open-webui:latest
    hostname: openwebui
    networks: ['demo']
    restart: unless-stopped
    environment:
      - OLLAMA_API_BASE_URL=http://ollama:11434/api   # Ollama API URL 
      - OLLAMA_HOST=ollama                            # Ollama hostname
      - OLLAMA_SCHEME=http                            # Connection protocol
      - OLLAMA_PORT=11434                             # Ollama port
    volumes:
      - openwebui_storage:/app/backend/data           # Persist OpenWebUI data
    profiles: ["none"]                                # IMPORTANT: Prevents this base service from starting
                                                      # Only the profile-specific services below will run

  # OpenWebUI for CPU profile
  openwebui-cpu:
    <<: *openwebui-base                               # Use OpenWebUI base configuration
    container_name: openwebui-cpu                     # Unique container name
    profiles: ["cpu"]                                 # Only starts with CPU profile
    ports:
      - 3000:8080                                     # Map container port 8080 to host port 3000
    depends_on:
      - ollama-cpu                                    # Connect to CPU version of Ollama

  # OpenWebUI for NVIDIA GPU profile
  openwebui-gpu:
    <<: *openwebui-base                               # Use OpenWebUI base configuration
    container_name: openwebui-gpu                     # Unique container name
    profiles: ["gpu-nvidia"]                          # Only starts with NVIDIA GPU profile
    ports:
      - 3000:8080                                     # Map container port 8080 to host port 3000
    depends_on:
      - ollama-gpu                                    # Connect to NVIDIA GPU version of Ollama

  # OpenWebUI for AMD GPU profile
  openwebui-gpu-amd:
    <<: *openwebui-base                               # Use OpenWebUI base configuration
    container_name: openwebui-gpu-amd                 # Unique container name
    profiles: ["gpu-amd"]                             # Only starts with AMD GPU profile
    ports:
      - 3000:8080                                     # Map container port 8080 to host port 3000
    depends_on:
      - ollama-gpu-amd                                # Connect to AMD GPU version of Ollama

  # CPU version of Ollama
  ollama-cpu:
    profiles: ["cpu"]                                 # Only starts with CPU profile
    <<: *service-ollama                               # Use Ollama base configuration

  # NVIDIA GPU version of Ollama
  ollama-gpu:
    profiles: ["gpu-nvidia"]                          # Only starts with NVIDIA GPU profile
    <<: *service-ollama                               # Use Ollama base configuration
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia                          # Use NVIDIA container runtime
              count: 1
              capabilities: [gpu]                     # Request GPU access

  # AMD GPU version of Ollama
  ollama-gpu-amd:
    profiles: ["gpu-amd"]                             # Only starts with AMD GPU profile
    <<: *service-ollama                               # Use Ollama base configuration
    image: ollama/ollama:rocm                         # Use ROCm image for AMD GPUs
    devices:                                          # Mount AMD GPU devices
      - "/dev/kfd"
      - "/dev/dri"

  # Initialize CPU version of Ollama with the llama3.2 model
  ollama-pull-llama-cpu:
    profiles: ["cpu"]                                 # Only starts with CPU profile
    <<: *init-ollama                                  # Use init-ollama base configuration
    depends_on:
      - ollama-cpu                                    # Wait for CPU Ollama to start

  # Initialize NVIDIA GPU version of Ollama with the llama3.2 model
  ollama-pull-llama-gpu:
    profiles: ["gpu-nvidia"]                          # Only starts with NVIDIA GPU profile
    <<: *init-ollama                                  # Use init-ollama base configuration
    depends_on:
      - ollama-gpu                                    # Wait for NVIDIA GPU Ollama to start

  # Initialize AMD GPU version of Ollama with the llama3.2 model
  ollama-pull-llama-gpu-amd:
    profiles: [gpu-amd]                               # Only starts with AMD GPU profile
    <<: *init-ollama                                  # Use init-ollama base configuration
    image: ollama/ollama:rocm                         # Use ROCm image for AMD GPUs
    depends_on:
     - ollama-gpu-amd                                 # Wait for AMD GPU Ollama to start